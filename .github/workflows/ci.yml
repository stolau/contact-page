name: gate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# No `concurrency:` block, deliberately. `cancel-in-progress` would cancel an
# in-flight run whenever a second push lands on the same PR -- which is exactly
# the red-then-green demo this workflow is introduced with, and a cancelled run
# is not a red run. Without `cancel-in-progress` the block only queues runs,
# which for a single-author repository buys nothing and lengthens that demo.
# Add it back with evidence if this repo ever gets concurrent contributors.
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25   # measured local full gate ~4m20s; budget 9-13m here
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Node 22.x is not redundant with the image's Node: README.md:130-136
      # pins 22.x because the JS suite uses experimental `mock.timers` and
      # because Node 23 changed the default reporter the TAP counters are read
      # from. This is that pin expressed where it binds.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No `playwright install`. tests/browser/conftest.py:181 passes
      # executable_path from tests/browser/chrome.py:39-51; the bundled
      # Chromium is never launched. See requirements-dev.txt:8-14.
      #
      # This step is a fast TRIPWIRE, not a resolution rule. The one resolution
      # is tests/browser/chrome.py:39-51 and the assertion that it works is
      # tests/browser/test_browser_gate.py:63-72, which runs in this same job.
      # Do NOT "improve" this into an independent resolution: a second rule is
      # precisely what tests/browser/chrome.py:12-18 exists to forbid.
      - name: Chrome, Node and Python are what the gate needs
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable)"
          echo "resolved Chrome: $CHROME"
          "$CHROME" --version
          node --version
          python --version

      - id: deps
        run: pip install -r requirements-dev.txt

      # Deliberately ungated. Adding `steps.deps.outcome == 'success'` here
      # would be a no-op: a failed tripwire skips `deps`, whose outcome is then
      # 'skipped', so ruff skips under either condition. Letting ruff survive a
      # failed tripwire would mean moving the tripwire below this step, which
      # costs the fast Chrome check its earliness and forces pytest's fence
      # into two clauses. Ruff is sub-second and every developer runs it
      # locally (README.md:118-122); that is not worth either price.
      - run: ruff check .

      # !cancelled() so a one-character ruff violation does not hide the test
      # result; steps.deps.outcome == 'success' so pytest does not run when
      # pytest is not installed, and does not run when the Chrome tripwire
      # failed (a failed tripwire skips `deps`, whose outcome is then
      # 'skipped') -- which would bury one real cause under 89 NO_CHROME
      # failures. No arguments: `pytest` means the whole gate, browser layer
      # included. tests/test_browser_marker.py fails in CI if any module under
      # tests/browser/ contributed nothing to this run.
      - name: pytest (the whole gate, browser layer included)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: pytest

      # Its own step and LAST, so an advisory is a distinct red step name and
      # can never prevent the tests from having run. In its OWN venv: pip-audit
      # pulls cyclonedx-python-lib/requests/packaging, and a resolver conflict
      # against flask==3.1.3's tree in the gate's environment would make the
      # SECURITY step red for a reason that is not a security finding.
      # Deliberately not in requirements-dev.txt: README.md:118-124 promises
      # that file plus ruff plus pytest IS the whole gate, and this result
      # changes with an external advisory feed rather than with the code.
      #
      # --strict because without it a dependency pip-audit cannot RESOLVE is
      # reported as a SKIP and this step still exits 0 -- a silently unscanned
      # dependency, in the PR whose whole subject is that nothing is scanned.
      - name: pip-audit (production dependencies, isolated venv)
        if: ${{ !cancelled() }}
        run: |
          python -m venv /tmp/audit
          /tmp/audit/bin/pip install --quiet pip-audit==2.10.1
          /tmp/audit/bin/pip-audit --strict -r requirements.txt
